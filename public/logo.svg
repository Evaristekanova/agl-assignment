<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" role="img" aria-label="AGL">
  <!-- Stylized low-poly bird in flight, facing left -->
  <!-- Upper wing: broad overlapping feathers, back (purple) to front (orange) -->
  <g>
    <polygon points="46,46 18,16 30,6 50,38" fill="#5b2a86"/>
    <polygon points="46,46 34,6 48,2 54,38" fill="#7c3aed"/>
    <polygon points="46,46 58,2 72,8 58,40" fill="#b81e78"/>
    <polygon points="46,46 80,12 90,24 62,42" fill="#e2007a"/>
    <polygon points="46,46 96,32 102,44 64,46" fill="#f26b3a"/>
  </g>
  <!-- Tail: broad feathers sweeping right -->
  <g>
    <polygon points="56,52 104,38 112,50 66,54" fill="#ec4899"/>
    <polygon points="56,52 114,58 106,70 64,58" fill="#d61f77"/>
    <polygon points="56,52 98,76 86,84 60,60" fill="#e04a4a"/>
    <polygon points="56,52 74,84 62,88 54,62" fill="#f58220"/>
  </g>
  <!-- Body and head -->
  <polygon points="6,46 24,30 50,40 60,54 34,60 16,54" fill="#3b2d73"/>
  <polygon points="24,30 42,36 52,42 32,44" fill="#6d28a9"/>
  <polygon points="6,46 26,46 20,54" fill="#e2007a"/>
  <!-- Beak -->
  <polygon points="0,47 9,42 9,51" fill="#f58220"/>
  <!-- Eye -->
  <circle cx="21" cy="39" r="2" fill="#ffffff"/>
</svg>
